<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Sistema Pra Padaria{% endblock %}</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <link rel="stylesheet" href="{{ cache_bust('/static/css/style.css') }}">
</head>
<body>
    {% set usuario = request.session.get("usuario") %}
    <nav class="navbar navbar-expand-lg navbar-dark bg-padaria mb-4">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="/">
                <img src="{{ cache_bust('/static/img/logo.png') }}" alt="Logo da Panificadora Rosa de Saron" class="navbar-logo">
                Panificadora Rosa de Saron
            </a>
            {% if usuario %}
            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav"
                aria-controls="navbarNav"
                aria-expanded="false"
                aria-label="Abrir menu"
            >
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <div class="navbar-nav">
                    <a class="nav-link" href="/funcionarios">Funcionários</a>
                    <a class="nav-link" href="/pagamentos">Pagamentos</a>
                    <a class="nav-link" href="/despesas">Despesas</a>
                    <a class="nav-link" href="/fechamentos-caixa">Fechamento de Caixa</a>
                </div>
                <div class="navbar-nav ms-auto align-items-lg-center">
                    <span class="nav-link text-white-50">Olá, {{ usuario.nome }}</span>
                    <form action="/logout" method="post" class="d-inline">
                        <button type="submit" class="btn btn-sm btn-outline-light">Sair</button>
                    </form>
                </div>
            </div>
            {% endif %}
        </div>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
